name: Windows Internal MSIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-task-1-red:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    steps:
      - name: Check out Task 1 RED tree
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prove new contracts fail against old production metadata
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'task1-compat-red-evidence'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null

          $nodeOutput = & node --test Windows/tools/tests/windows-version.contract.test.mjs 2>&1
          $nodeExit = $LASTEXITCODE
          $nodeText = $nodeOutput | Out-String
          Set-Content -LiteralPath (Join-Path $evidenceRoot 'node-red.log') -Value $nodeText
          $nodeText | Write-Host
          if ($nodeExit -eq 0) {
            throw 'RED Node contract unexpectedly passed against old metadata.'
          }
          foreach ($expectedFailure in @(
            'Windows Internal metadata keeps the version and compatibility contract',
            'resolver emits the CI package object and accepts only the exact Windows tag',
            'resolver rejects malformed or inconsistent metadata'
          )) {
            if ($nodeText -notmatch [regex]::Escape($expectedFailure)) {
              throw "RED Node evidence did not include '$expectedFailure'."
            }
          }
          if ($nodeText -match '# SKIP') {
            throw 'RED Node resolver tests must execute on the Windows runner, not skip.'
          }

          $managedOutput = & dotnet test Windows/tests/EMKE.Integration.Tests/EMKE.Integration.Tests.csproj --configuration Release --filter 'FullyQualifiedName~VersionMetadataTests' --logger 'console;verbosity=detailed' 2>&1
          $managedExit = $LASTEXITCODE
          $managedText = $managedOutput | Out-String
          Set-Content -LiteralPath (Join-Path $evidenceRoot 'managed-red.log') -Value $managedText
          $managedText | Write-Host
          if ($managedExit -eq 0) {
            throw 'RED managed VersionMetadataTests unexpectedly passed against old metadata.'
          }
          if ($managedText -notmatch 'VersionMetadataDefinesCanonicalInternalRelease') {
            throw 'RED managed evidence did not include VersionMetadataDefinesCanonicalInternalRelease.'
          }

          @"
          ## Task 1 RED evidence

          - Source commit: $env:GITHUB_SHA
          - Node contract: failed as expected (exit $nodeExit); resolver tests executed without skips.
          - Managed VersionMetadataTests: failed as expected (exit $managedExit).
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload RED logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task1-compat-red-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/task1-compat-red-evidence
          if-no-files-found: error
          retention-days: 14
