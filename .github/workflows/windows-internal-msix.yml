name: Windows Internal MSIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-task-2-green:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - name: Check out Task 2 final GREEN tree
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prove final Task 2 managed compatibility gates
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'task2-compat-final-green-evidence'
          $resultsRoot = 'Windows/out/task2-compat-final-green-results'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $resultsRoot -Force | Out-Null

          $restoreOutput = & dotnet restore Windows/EMKE.Windows.slnx --locked-mode 2>&1
          $restoreExit = $LASTEXITCODE
          $restoreText = $restoreOutput | Out-String
          Set-Content -LiteralPath (Join-Path $evidenceRoot 'locked-restore.log') -Value $restoreText
          $restoreText | Write-Host
          if ($restoreExit -ne 0) {
            throw 'Final GREEN locked restore failed.'
          }

          $commands = @(
            @{
              Name = 'application-compatibility';
              Project = 'Windows/tests/EMKE.Application.Tests/EMKE.Application.Tests.csproj';
              Filter = 'FullyQualifiedName~Compatibility';
              ExpectedTotal = 30
            },
            @{
              Name = 'windows-app-composition';
              Project = 'Windows/tests/EMKE.Windows.App.Tests/EMKE.Windows.App.Tests.csproj';
              Filter = 'FullyQualifiedName~CompatibilityManifestResourceTests|FullyQualifiedName~ProductionCompositionTests';
              ExpectedTotal = 8
            },
            @{
              Name = 'integration-host-probe';
              Project = 'Windows/tests/EMKE.Integration.Tests/EMKE.Integration.Tests.csproj';
              Filter = 'FullyQualifiedName~WindowsHostCompatibilityProbeTests';
              ExpectedTotal = 7
            }
          )

          foreach ($command in $commands) {
            $trxName = $command.Name + '.trx'
            $output = & dotnet test $command.Project --configuration Release --filter $command.Filter --logger "trx;LogFileName=$trxName" --results-directory $resultsRoot 2>&1
            $exit = $LASTEXITCODE
            $text = $output | Out-String
            Set-Content -LiteralPath (Join-Path $evidenceRoot ($command.Name + '.log')) -Value $text
            $text | Write-Host
            if ($exit -ne 0) {
              throw "Final GREEN $($command.Name) failed."
            }
            $trxPath = Join-Path $resultsRoot $trxName
            if (-not (Test-Path -LiteralPath $trxPath -PathType Leaf)) {
              throw "Final GREEN $($command.Name) did not produce TRX evidence."
            }
            [xml]$trx = Get-Content -LiteralPath $trxPath -Raw
            $counters = $trx.TestRun.ResultSummary.Counters
            if (
              [int]$counters.total -ne $command.ExpectedTotal -or
              [int]$counters.executed -ne $command.ExpectedTotal -or
              [int]$counters.passed -ne $command.ExpectedTotal -or
              [int]$counters.failed -ne 0 -or
              [int]$counters.notExecuted -ne 0
            ) {
              throw "Final GREEN $($command.Name) did not pass its exact managed test contract."
            }
          }

          $buildOutput = & dotnet build Windows/EMKE.Windows.slnx --configuration Release 2>&1
          $buildExit = $LASTEXITCODE
          $buildText = $buildOutput | Out-String
          Set-Content -LiteralPath (Join-Path $evidenceRoot 'release-build.log') -Value $buildText
          $buildText | Write-Host
          if ($buildExit -ne 0) {
            throw 'Final GREEN managed Release build failed.'
          }

          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw 'Final GREEN git diff --check failed.'
          }

          @"
          ## Task 2 final GREEN evidence

          - Source commit: $env:GITHUB_SHA
          - Locked restore passed.
          - Application compatibility: 30 passed, 0 failed.
          - Windows App composition/resource: 8 passed, 0 failed.
          - Integration host probe: 7 passed, 0 failed.
          - Managed Release build and git diff --check passed.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload final GREEN logs and TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task2-compat-final-green-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/task2-compat-final-green-evidence
            Windows/out/task2-compat-final-green-results
          if-no-files-found: error
          retention-days: 14
