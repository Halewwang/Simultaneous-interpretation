name: Windows Internal MSIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-task-2-red:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    steps:
      - name: Check out Task 2 RED tree
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prove Task 2 contracts fail against the pre-production host gate
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'task2-compat-red-evidence'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null

          dotnet restore Windows/EMKE.Windows.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) {
            throw 'RED locked restore failed before managed evidence could run.'
          }

          $commands = @(
            @{
              Name = 'application';
              Arguments = @(
                'test',
                'Windows/tests/EMKE.Application.Tests/EMKE.Application.Tests.csproj',
                '--configuration', 'Release', '--no-restore',
                '--filter', 'FullyQualifiedName~Compatibility',
                '--logger', 'console;verbosity=detailed'
              );
              Expected = 'EmbeddedInternalJsonIsParsedStrictlyWithoutAllowAnyFallback'
            },
            @{
              Name = 'integration';
              Arguments = @(
                'test',
                'Windows/tests/EMKE.Integration.Tests/EMKE.Integration.Tests.csproj',
                '--configuration', 'Release', '--no-restore',
                '--filter', 'FullyQualifiedName~WindowsHostCompatibilityProbeTests',
                '--logger', 'console;verbosity=detailed'
              );
              Expected = 'MetadataBackedHostGateAdmitsOnlySupportedWorkstations'
            },
            @{
              Name = 'windows-app';
              Arguments = @(
                'test',
                'Windows/tests/EMKE.Windows.App.Tests/EMKE.Windows.App.Tests.csproj',
                '--configuration', 'Release', '--no-restore',
                '--filter', 'FullyQualifiedName~ProductionCompositionTests',
                '--logger', 'console;verbosity=detailed'
              );
              Expected = 'ProductionCoreComposesMetadataBackedWindowsHostGate'
            },
            @{
              Name = 'manifest-resource';
              Arguments = @(
                'test',
                'Windows/tests/EMKE.Windows.App.Tests/EMKE.Windows.App.Tests.csproj',
                '--configuration', 'Release', '--no-restore',
                '--filter', 'FullyQualifiedName~CompatibilityManifestResourceTests',
                '--logger', 'console;verbosity=detailed'
              );
              Expected = 'AppEmbedsAndLoadsExactInternalCompatibilityManifest'
            }
          )

          foreach ($command in $commands) {
            $output = & dotnet @($command.Arguments) 2>&1
            $exit = $LASTEXITCODE
            $text = $output | Out-String
            Set-Content -LiteralPath (Join-Path $evidenceRoot ($command.Name + '.log')) -Value $text
            $text | Write-Host
            if ($exit -eq 0) {
              throw "RED $($command.Name) unexpectedly passed against the pre-production host gate."
            }
            if ($text -notmatch [regex]::Escape($command.Expected)) {
              throw "RED $($command.Name) did not run the expected test $($command.Expected)."
            }
          }

          @"
          ## Task 2 RED evidence

          - Source commit: $env:GITHUB_SHA
          - Application compatibility filter: failed as expected.
          - Integration host-probe filter: failed as expected.
          - Windows App composition and resource filters: failed as expected.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload RED logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task2-compat-red-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/task2-compat-red-evidence
          if-no-files-found: error
          retention-days: 14
