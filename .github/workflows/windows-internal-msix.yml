name: Windows Internal MSIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate-task-2-lockfiles:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    steps:
      - name: Check out Task 2 lockfile tree
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Regenerate only retargeted lockfiles
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $stagingRoot = Join-Path $env:RUNNER_TEMP 'task2-lockfile-regeneration'
          New-Item -ItemType Directory -Path $stagingRoot -Force | Out-Null

          dotnet restore Windows/EMKE.Windows.slnx --force-evaluate
          if ($LASTEXITCODE -ne 0) {
            throw 'Task 2 force-evaluate restore failed.'
          }

          $changed = @(git diff --name-only -- 'Windows/**/packages.lock.json')
          if ($changed.Count -eq 0) {
            throw 'Task 2 retarget did not regenerate any lockfiles.'
          }
          foreach ($relativePath in $changed) {
            $destination = Join-Path $stagingRoot $relativePath
            New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
            Copy-Item -LiteralPath $relativePath -Destination $destination -Force
          }
          $changed | Set-Content -LiteralPath (Join-Path $stagingRoot 'changed-lockfiles.txt')
          git diff -- Windows/**/packages.lock.json | Set-Content -LiteralPath (Join-Path $stagingRoot 'lockfile.diff')

          @"
          ## Task 2 lockfile regeneration

          - Source commit: $env:GITHUB_SHA
          - Command: dotnet restore Windows/EMKE.Windows.slnx --force-evaluate
          - Changed lockfiles: $($changed.Count)
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload regenerated Task 2 lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: task2-lockfile-regeneration-${{ github.sha }}
          path: ${{ runner.temp }}/task2-lockfile-regeneration
          if-no-files-found: error
          retention-days: 14
