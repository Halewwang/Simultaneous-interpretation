name: Windows Internal MSIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-task-1-green:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    steps:
      - name: Check out Task 1 GREEN tree
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prove targeted compatibility contracts are green
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'task1-compat-green-evidence'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null

          $nodeOutput = & node --test Windows/tools/tests/windows-version.contract.test.mjs 2>&1
          $nodeExit = $LASTEXITCODE
          $nodeText = $nodeOutput | Out-String
          Set-Content -LiteralPath (Join-Path $evidenceRoot 'node-green.log') -Value $nodeText
          $nodeText | Write-Host
          if ($nodeExit -ne 0) {
            throw 'GREEN Node contract failed.'
          }
          if ($nodeText -match '# SKIP' -or $nodeText -notmatch 'pass 4') {
            throw 'GREEN Node contract must execute all four tests without skips.'
          }

          $resolverOutput = & pwsh -NoLogo -NoProfile -Command "& 'Windows/tools/resolve-version.ps1' -VersionFile 'Windows/version.json' | ConvertTo-Json -Compress -Depth 5" 2>&1
          $resolverExit = $LASTEXITCODE
          $resolverText = $resolverOutput | Out-String
          Set-Content -LiteralPath (Join-Path $evidenceRoot 'resolver-green.json') -Value $resolverText
          $resolverText | Write-Host
          if ($resolverExit -ne 0) {
            throw 'GREEN resolver failed.'
          }
          $resolved = $resolverText | ConvertFrom-Json
          if (
            $resolved.MinimumWindowsBuild -ne 19045 -or
            $resolved.MinimumWindowsApiContract -ne '10.0.19041.0' -or
            $resolved.MaximumVersionTested -ne '10.0.26200.0'
          ) {
            throw 'GREEN resolver did not return the required Windows 10-11 compatibility values.'
          }

          $managedResults = 'Windows/out/task1-compat-green-results'
          New-Item -ItemType Directory -Path $managedResults -Force | Out-Null
          $managedOutput = & dotnet test Windows/tests/EMKE.Integration.Tests/EMKE.Integration.Tests.csproj --configuration Release --filter 'FullyQualifiedName~VersionMetadataTests' --logger 'trx;LogFileName=task1-version-metadata-green.trx' --results-directory $managedResults 2>&1
          $managedExit = $LASTEXITCODE
          $managedText = $managedOutput | Out-String
          Set-Content -LiteralPath (Join-Path $evidenceRoot 'managed-green.log') -Value $managedText
          $managedText | Write-Host
          if ($managedExit -ne 0) {
            throw 'GREEN managed VersionMetadataTests failed.'
          }
          $trxPath = Join-Path $managedResults 'task1-version-metadata-green.trx'
          if (-not (Test-Path -LiteralPath $trxPath -PathType Leaf)) {
            throw 'GREEN managed VersionMetadataTests did not write TRX evidence.'
          }
          [xml]$trx = Get-Content -LiteralPath $trxPath -Raw
          $counters = $trx.TestRun.ResultSummary.Counters
          if (
            [int]$counters.total -ne 4 -or
            [int]$counters.executed -ne 4 -or
            [int]$counters.passed -ne 4 -or
            [int]$counters.failed -ne 0 -or
            [int]$counters.notExecuted -ne 0
          ) {
            throw 'GREEN managed VersionMetadataTests must execute and pass exactly four tests without skips.'
          }

          @"
          ## Task 1 GREEN evidence

          - Source commit: $env:GITHUB_SHA
          - Node contract: 4 passed, 0 skipped.
          - Resolver: returned 19045, 10.0.19041.0, and 10.0.26200.0.
          - Managed VersionMetadataTests: 4 passed, 0 skipped.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload GREEN logs and TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task1-compat-green-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/task1-compat-green-evidence
            Windows/out/task1-compat-green-results
          if-no-files-found: error
          retention-days: 14
