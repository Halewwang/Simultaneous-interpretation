name: Windows Internal MSIX

on:
  workflow_dispatch:
    inputs:
      run_hosted_install_validation:
        description: Run application-preview install validation on the hosted Windows runner
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - "Windows/**"
      - "Shared/**"
      - "Scripts/validate-shared-contracts.mjs"
      - ".github/workflows/windows-internal-msix.yml"
  push:
    branches:
      - main
      - codex/windows-internal-msix
    paths:
      - "Windows/**"
      - "Shared/**"
      - "Scripts/validate-shared-contracts.mjs"
      - ".github/workflows/windows-internal-msix.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate portable contracts and locked restore
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $release = & pwsh -NoProfile -Command "& 'Windows/tools/resolve-version.ps1' | ConvertTo-Json -Compress" |
            ConvertFrom-Json
          $expectedProcessorArchitecture = switch ($release.Architecture) {
            "x64" { "AMD64" }
            default { throw "Unsupported release architecture '$($release.Architecture)'." }
          }
          if ($env:PROCESSOR_ARCHITECTURE -cne $expectedProcessorArchitecture) {
            throw "Internal MSIX build requires an x64 hosted process."
          }
          node Scripts/validate-shared-contracts.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "Shared contract validation failed."
          }
          node --test Windows/driver/tests/*.test.mjs Windows/tools/tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "Windows portable contract tests failed."
          }
          dotnet restore Windows/EMKE.Windows.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) {
            throw "Windows locked restore failed."
          }

      - name: Build and test native Release audio
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Push-Location Windows/native
          try {
            cmake --preset windows-x64-release
            if ($LASTEXITCODE -ne 0) {
              throw "Native CMake configuration failed."
            }
            cmake --build --preset windows-x64-release
            if ($LASTEXITCODE -ne 0) {
              throw "Native Release build failed."
            }
            ctest --preset windows-x64-release
            if ($LASTEXITCODE -ne 0) {
              throw "Native CTest gate failed."
            }
          } finally {
            Pop-Location
          }

      - name: Build and test managed Release product
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          dotnet build Windows/EMKE.Windows.slnx `
            --configuration Release `
            --no-restore
          if ($LASTEXITCODE -ne 0) {
            throw "Windows managed Release build failed."
          }
          dotnet test Windows/EMKE.Windows.slnx `
            --configuration Release `
            --no-build `
            --logger "trx;LogFileName=windows-internal-msix.trx"
          if ($LASTEXITCODE -ne 0) {
            throw "Windows managed test gate failed."
          }

  sign-package-bundle:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/windows-internal-msix' }}
    needs: build-test
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    environment: windows-internal-signing
    outputs:
      certificate_thumbprint: ${{ steps.package.outputs.certificate_thumbprint }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve checked-in Windows release metadata
        id: release
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $release = & pwsh -NoProfile -Command "& 'Windows/tools/resolve-version.ps1' | ConvertTo-Json -Compress" |
            ConvertFrom-Json
          $expectedProcessorArchitecture = switch ($release.Architecture) {
            "x64" { "AMD64" }
            default { throw "Unsupported release architecture '$($release.Architecture)'." }
          }
          if ($env:PROCESSOR_ARCHITECTURE -cne $expectedProcessorArchitecture) {
            throw "Internal MSIX packaging requires the resolved architecture."
          }
          $packageBaseName = "EMKE-Translation-Windows-$($release.ProductVersion)-$($release.Channel)-$($release.Architecture)"
          "package_base_name=$packageBaseName" >> $env:GITHUB_OUTPUT
          "artifact_name=emke-translation-windows-$($release.ProductVersion)-$($release.Channel)-$($release.Architecture)-${{ github.sha }}" >> $env:GITHUB_OUTPUT

      - name: Restore locked managed packaging inputs
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          dotnet restore Windows/EMKE.Windows.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) {
            throw "Windows locked packaging restore failed."
          }

      - name: Build native Release package input
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Push-Location Windows/native
          try {
            cmake --preset windows-x64-release
            if ($LASTEXITCODE -ne 0) {
              throw "Native packaging configuration failed."
            }
            cmake --build --preset windows-x64-release
            if ($LASTEXITCODE -ne 0) {
              throw "Native packaging input build failed."
            }
          } finally {
            Pop-Location
          }

      - name: Reconstruct, sign, and verify Internal MSIX
        id: package
        shell: pwsh
        env:
          WINDOWS_INTERNAL_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_INTERNAL_SIGNING_PFX_BASE64 }}
          WINDOWS_INTERNAL_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_INTERNAL_SIGNING_PFX_PASSWORD }}
          PACKAGE_BASE_NAME: ${{ steps.release.outputs.package_base_name }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $signingRoot = Join-Path `
            $env:RUNNER_TEMP `
            ("emke-msix-signing-" + [Guid]::NewGuid().ToString("N"))
          $pfxPath = Join-Path $signingRoot "app.pfx"
          $pfxBytes = $null
          try {
            if (
              [string]::IsNullOrWhiteSpace(
                $env:WINDOWS_INTERNAL_SIGNING_PFX_BASE64
              ) -or
              [string]::IsNullOrEmpty(
                $env:WINDOWS_INTERNAL_SIGNING_PFX_PASSWORD
              )
            ) {
              throw "Required Internal signing secrets are unavailable."
            }
            [IO.Directory]::CreateDirectory($signingRoot) | Out-Null
            try {
              $pfxBytes = [Convert]::FromBase64String(
                $env:WINDOWS_INTERNAL_SIGNING_PFX_BASE64
              )
            } catch {
              throw "Internal signing PFX reconstruction failed."
            }
            [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

            $artifactRoot = Join-Path $PWD "Windows/artifacts/msix"
            [IO.Directory]::CreateDirectory($artifactRoot) | Out-Null
            $certificatePath = Join-Path `
              $artifactRoot `
              "$env:PACKAGE_BASE_NAME.cer"
            pwsh -NoProfile -File `
              Windows/tools/verify-internal-signing-certificate.ps1 `
              -PfxPath $pfxPath `
              -PasswordEnvironmentVariable `
                WINDOWS_INTERNAL_SIGNING_PFX_PASSWORD `
              -ExpectedSubject "CN=EMKE Internal Test" `
              -ExportPublicCertificatePath $certificatePath
            if ($LASTEXITCODE -ne 0) {
              throw "Internal signing certificate verification failed."
            }

            pwsh -NoProfile -File Windows/tools/package-msix.ps1 `
              -Configuration Release `
              -PfxPath $pfxPath `
              -PasswordEnvironmentVariable `
                WINDOWS_INTERNAL_SIGNING_PFX_PASSWORD
            if ($LASTEXITCODE -ne 0) {
              throw "Internal MSIX packaging failed."
            }

            $packagePath = Join-Path `
              $artifactRoot `
              "$env:PACKAGE_BASE_NAME.msix"
            pwsh -NoProfile -File Windows/tools/verify-msix.ps1 `
              -Package $packagePath
            if ($LASTEXITCODE -ne 0) {
              throw "Internal MSIX verification failed."
            }
          } finally {
            $env:WINDOWS_INTERNAL_SIGNING_PFX_BASE64 = $null
            $env:WINDOWS_INTERNAL_SIGNING_PFX_PASSWORD = $null
            if ($null -ne $pfxBytes) {
              [Array]::Clear($pfxBytes, 0, $pfxBytes.Length)
            }
            if (Test-Path -LiteralPath $pfxPath) {
              Remove-Item -LiteralPath $pfxPath -Force
            }
            if (
              Test-Path -LiteralPath $signingRoot -PathType Container
            ) {
              Remove-Item -LiteralPath $signingRoot -Force
            }
          }

      - name: Build exact handoff bundle
        shell: pwsh
        env:
          PACKAGE_BASE_NAME: ${{ steps.release.outputs.package_base_name }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $allowedOutputRoot = Join-Path $PWD "Windows/artifacts"
          $artifactRoot = Join-Path $allowedOutputRoot "msix"
          $bundleRoot = Join-Path $allowedOutputRoot "internal-bundle"
          pwsh -NoProfile -File `
            Windows/tools/build-internal-msix-bundle.ps1 `
            -PackagePath (
              Join-Path `
                $artifactRoot `
                "$env:PACKAGE_BASE_NAME.msix"
            ) `
            -CertificatePath (
              Join-Path `
                $artifactRoot `
                "$env:PACKAGE_BASE_NAME.cer"
            ) `
            -InstallScriptPath (
              Join-Path `
                $PWD `
                "Windows/packaging/App/Install-EMKE-Translation-Internal.ps1"
            ) `
            -UninstallScriptPath (
              Join-Path `
                $PWD `
                "Windows/packaging/App/Uninstall-EMKE-Translation-Internal.ps1"
            ) `
            -AllowedOutputRoot $allowedOutputRoot `
            -OutputDirectory $bundleRoot `
            -SourceCommit "${{ github.sha }}" `
            -WorkflowRunId "${{ github.run_id }}" `
            -PackageIdentity "EMKE.Translation.Internal" `
            -CertificateThumbprint `
              "${{ steps.package.outputs.certificate_thumbprint }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Internal handoff bundle construction failed."
          }

      - name: Upload verified Internal bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: Windows/artifacts/internal-bundle
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  install-hosted-preview:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_hosted_install_validation }}
    needs: sign-package-bundle
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download exact signed Internal bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.sign-package-bundle.outputs.artifact_name }}
          path: Windows/artifacts/internal-bundle

      - name: Resolve and report hosted Windows metadata
        id: release
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $release = & pwsh -NoProfile -Command "& 'Windows/tools/resolve-version.ps1' | ConvertTo-Json -Compress" |
            ConvertFrom-Json
          $expectedProcessorArchitecture = switch ($release.Architecture) {
            "x64" { "AMD64" }
            default { throw "Unsupported release architecture '$($release.Architecture)'." }
          }
          $operatingSystem = Get-CimInstance -ClassName Win32_OperatingSystem
          $windowsBuild = [Environment]::OSVersion.Version.Build
          Write-Host "Hosted Windows version=$($operatingSystem.Version) build=$windowsBuild architecture=$($operatingSystem.OSArchitecture) productType=$($operatingSystem.ProductType)"
          if ($env:PROCESSOR_ARCHITECTURE -cne $expectedProcessorArchitecture) {
            throw "The install runner architecture does not match release metadata."
          }
          $evidenceBuild = ([version]$release.MaximumVersionTested).Build
          Write-Host "Hosted Windows applicationFloor=$($release.MinimumWindowsBuild) maximumVersionTestedBuild=$evidenceBuild"
          if ($operatingSystem.ProductType -eq 1) {
            $expectedSmokeStatus = "driverMissing"
          } else {
            $expectedSmokeStatus = "unsupportedWindowsProductType"
          }
          $packageBaseName = "EMKE-Translation-Windows-$($release.ProductVersion)-$($release.Channel)-$($release.Architecture)"
          "package_base_name=$packageBaseName" >> $env:GITHUB_OUTPUT
          "package_version=$($release.PackageVersion)" >> $env:GITHUB_OUTPUT
          "architecture=$($release.Architecture.ToUpperInvariant())" >> $env:GITHUB_OUTPUT
          "publisher=$($release.Publisher)" >> $env:GITHUB_OUTPUT
          "expected_smoke_status=$expectedSmokeStatus" >> $env:GITHUB_OUTPUT

      - name: Install, query, smoke, and remove exact Internal MSIX
        shell: pwsh
        env:
          PACKAGE_BASE_NAME: ${{ steps.release.outputs.package_base_name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
          PACKAGE_ARCHITECTURE: ${{ steps.release.outputs.architecture }}
          PACKAGE_PUBLISHER: ${{ steps.release.outputs.publisher }}
          EXPECTED_SMOKE_STATUS: ${{ steps.release.outputs.expected_smoke_status }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $artifactRoot = Join-Path $PWD "Windows/artifacts/internal-bundle"
          $thumbprint =
            "${{ needs.sign-package-bundle.outputs.certificate_thumbprint }}".
              ToUpperInvariant()
          if ($thumbprint -notmatch "^[0-9A-F]{40}$") {
            throw "The signing job did not emit an exact certificate thumbprint."
          }
          $existingCertificate = Test-Path -LiteralPath (
            "Cert:\LocalMachine\TrustedPeople\$thumbprint"
          )
          if ($existingCertificate) {
            throw "The ephemeral 25H2 runner already trusts the Internal certificate."
          }
          $packagePath = Join-Path `
            $artifactRoot `
            "$env:PACKAGE_BASE_NAME.msix"
          $packageHash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash
          $signatureBeforeTrust = Get-AuthenticodeSignature -FilePath $packagePath
          $preTrustSigner = $signatureBeforeTrust.SignerCertificate
          $preTrustSignerSubject = if ($null -eq $preTrustSigner) { "<none>" } else { $preTrustSigner.Subject }
          $preTrustSignerThumbprint = if ($null -eq $preTrustSigner) { "<none>" } else { $preTrustSigner.Thumbprint }
          Write-Host "Hosted MSIX sha256=$packageHash signaturePreTrustStatus=$($signatureBeforeTrust.Status) signer=$preTrustSignerSubject thumbprint=$preTrustSignerThumbprint"
          $cleanupMarker = Join-Path `
            $env:RUNNER_TEMP `
            "emke-internal-msix-${{ github.run_id }}-${{ github.run_attempt }}.thumbprint"
          [IO.File]::WriteAllText(
            $cleanupMarker,
            $thumbprint,
            [Text.UTF8Encoding]::new($false)
          )
          pwsh -NoProfile -File Windows/tools/test-hosted-msix-install.ps1 `
            -PackagePath $packagePath `
            -CertificatePath (
              Join-Path `
                $artifactRoot `
                "$env:PACKAGE_BASE_NAME.cer"
            ) `
            -ExpectedCertificateThumbprint $thumbprint `
            -ExpectedPublisher $env:PACKAGE_PUBLISHER `
            -ExpectedVersion $env:PACKAGE_VERSION `
            -ExpectedArchitecture $env:PACKAGE_ARCHITECTURE `
            -ExpectedSmokeStatus $env:EXPECTED_SMOKE_STATUS
          if ($LASTEXITCODE -ne 0) {
            throw "Hosted Internal MSIX install validation failed."
          }
          Write-Host "Hosted MSIX install=passed identity=EMKE.Translation.Internal version=$env:PACKAGE_VERSION smokeStatus=$env:EXPECTED_SMOKE_STATUS uninstall=passed certificateCleanup=passed"

      - name: Ensure exact certificate cleanup
        if: always()
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $cleanupMarker = Join-Path `
            $env:RUNNER_TEMP `
            "emke-internal-msix-${{ github.run_id }}-${{ github.run_attempt }}.thumbprint"
          if (Test-Path -LiteralPath $cleanupMarker -PathType Leaf) {
            $thumbprint = (
              [IO.File]::ReadAllText($cleanupMarker)
            ).Trim().ToUpperInvariant()
            try {
              if ($thumbprint -notmatch "^[0-9A-F]{40}$") {
                throw "The cleanup marker has an invalid thumbprint."
              }
              $store =
                [Security.Cryptography.X509Certificates.X509Store]::new(
                  [Security.Cryptography.X509Certificates.StoreName]::TrustedPeople,
                  [Security.Cryptography.X509Certificates.StoreLocation]::LocalMachine
                )
              try {
                $store.Open(
                  [Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite
                )
                $matches = @(
                  $store.Certificates |
                    Where-Object {
                      $_.Thumbprint.ToUpperInvariant() -ceq $thumbprint
                    }
                )
                foreach ($match in $matches) {
                  $store.Remove($match)
                }
              } finally {
                $store.Close()
                $store.Dispose()
              }
            } finally {
              Remove-Item -LiteralPath $cleanupMarker -Force
            }
          }
          Write-Host "Hosted signing-certificate cleanup=passed"
