name: Windows Audio Foundation

on:
  push:
    branches:
      - codex/windows-audio-foundation
  pull_request:
    paths:
      - "Windows/**"
      - "Shared/TestVectors/Audio/**"
      - ".github/workflows/windows-audio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-toolchain-proof:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate shared contract and build native audio scaffold
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          node Scripts/validate-shared-contracts.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "Shared contract validator failed."
          }

          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            throw "Hosted runner architecture must be AMD64."
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere is unavailable on the hosted runner."
          }
          $vsInstallationPath = & $vswhere -latest -products * -version "[18.0,19.0)" -property installationPath 2>$null
          if ([string]::IsNullOrWhiteSpace($vsInstallationPath)) {
            throw "vswhere did not resolve a Visual Studio 18 installation."
          }
          $visualStudioVersion = (& $vswhere -latest -products * -version "[18.0,19.0)" -property installationVersion 2>$null).Trim()
          if ([string]::IsNullOrWhiteSpace($visualStudioVersion)) {
            throw "vswhere did not resolve a Visual Studio installation with major version 18."
          }
          if ($visualStudioVersion -notmatch "^(?<visualStudioMajor>[0-9]+)(?:\.|$)") {
            throw "vswhere did not resolve a Visual Studio installation with major version 18."
          }
          if ([int]$Matches["visualStudioMajor"] -ne 18) {
            throw "vswhere did not resolve a Visual Studio installation with major version 18."
          }

          $cmakeVersionLine = (cmake --version | Select-Object -First 1).Trim()
          if ($cmakeVersionLine -notmatch "^cmake version ([0-9]+(?:\.[0-9]+){1,3})$") {
            throw "CMake did not report a parseable version."
          }
          $cmakeVersion = [version]$Matches[1]
          if ($cmakeVersion -lt [version]"4.2") {
            throw "CMake must be at least 4.2."
          }

          pwsh Windows/tools/verify-toolchain.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Windows toolchain verifier failed."
          }

          Push-Location Windows/native
          try {
            cmake --preset windows-x64-release
            if ($LASTEXITCODE -ne 0) {
              throw "Native CMake configuration failed."
            }

            cmake --build --preset windows-x64-release
            if ($LASTEXITCODE -ne 0) {
              throw "Native CMake build failed."
            }

            ctest --preset windows-x64-release
            if ($LASTEXITCODE -ne 0) {
              throw "Native CTest run failed."
            }
          } finally {
            Pop-Location
          }

          $windowsVersion = (Get-CimInstance -ClassName Win32_OperatingSystem).Version
          if ($windowsVersion -notmatch "^(?:[0-9]+\.){2}([0-9]+)(?:\.[0-9]+)?$") {
            throw "Windows build could not be parsed."
          }
          $windowsBuild = [int]$Matches[1]
          $targetOsEligible = $windowsBuild -ge 26200
          $targetOsEligibleValue = $targetOsEligible.ToString().ToLowerInvariant()
          $runnerImage = if ([string]::IsNullOrWhiteSpace($env:ImageOS)) { "unavailable" } else { $env:ImageOS }
          $runnerImageVersion = if ([string]::IsNullOrWhiteSpace($env:ImageVersion)) { "unavailable" } else { $env:ImageVersion }

          $summary = @"
          ## EMKE Windows hosted toolchain proof

          - Runner image: $runnerImage
          - Runner image version: $runnerImageVersion
          - Windows build: $windowsBuild
          - Architecture: $env:PROCESSOR_ARCHITECTURE
          - Visual Studio version: $visualStudioVersion
          - CMake version: $cmakeVersion
          - Source commit: $env:GITHUB_SHA

          ## Proof boundary

          ```text
          targetOsEligible = $targetOsEligibleValue
          installedWdkProof = pending
          nativeBuild = passed
          driverBuild = pending
          driverInstall = pending
          liveEndpoints = pending
          ```
          "@
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary
