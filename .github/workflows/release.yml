name: Release EMKE Translation

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version and build
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "release tag must be vMAJOR.MINOR.PATCH with components from 0 through 999" >&2
            exit 64
          fi
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$version"
          build_number="$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))"
          if test "$build_number" -lt 0 || test "$build_number" -gt 999999999; then
            echo "resolved build number is outside the supported range" >&2
            exit 64
          fi
          commit_epoch="$(git show -s --format=%ct "${GITHUB_SHA}^{commit}")"
          if [[ ! "$commit_epoch" =~ ^[0-9]+$ ]] || \
            test "${#commit_epoch}" -gt 12 || test "$commit_epoch" -le 0; then
            echo "tagged commit has an invalid source timestamp" >&2
            exit 64
          fi
          /usr/bin/printf 'EMKE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          /usr/bin/printf 'EMKE_BUILD_NUMBER=%s\n' "$build_number" >> "$GITHUB_ENV"
          /usr/bin/printf 'SOURCE_DATE_EPOCH=%s\n' "$commit_epoch" >> "$GITHUB_ENV"

      - name: Run Swift tests
        run: swift test

      - name: Run packaging tests
        shell: bash
        run: |
          set -euo pipefail
          env -u EMKE_VERSION -u EMKE_BUILD_NUMBER \
            bash Packaging/Tests/run-all.sh

      - name: Build versioned internal package
        shell: bash
        run: |
          set -euo pipefail
          EMKE_VERSION="$EMKE_VERSION" \
            EMKE_BUILD_NUMBER="$EMKE_BUILD_NUMBER" \
            bash Packaging/build-internal-pkg.sh

      - name: Sign update and render Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PRIVATE_KEY"
          runner_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          test "$runner_temp" != /
          pkg=".build/distribution/EMKE-Translation-${EMKE_VERSION}-internal.pkg"
          test -s "$pkg"
          sign_tool="$(/usr/bin/find .build/artifacts \
            -type f -path '*/Sparkle/bin/sign_update' -perm -111 \
            -print -quit)"
          test -x "$sign_tool"
          key_file=""
          cleanup_key() {
            case "${key_file:-}" in
              "$runner_temp"/emke-sparkle-key.*)
                /bin/rm -f -- "$key_file"
                ;;
              "")
                ;;
              *)
                echo "refusing unsafe Sparkle key cleanup target" >&2
                ;;
            esac
          }
          trap cleanup_key EXIT
          key_file="$(/usr/bin/mktemp "$runner_temp/emke-sparkle-key.XXXXXX")"
          /bin/chmod 600 "$key_file"
          test "$(/usr/bin/stat -f '%Lp' "$key_file")" = "600"
          /usr/bin/printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file"
          unset SPARKLE_PRIVATE_KEY
          signing_output="$("$sign_tool" --ed-key-file "$key_file" "$pkg")"
          signature_pattern='^sparkle:edSignature="([A-Za-z0-9+/]{86}==)" length="([0-9]+)"$'
          if [[ ! "$signing_output" =~ $signature_pattern ]]; then
            echo "Sparkle sign_update returned an unexpected result" >&2
            exit 1
          fi
          signature="${BASH_REMATCH[1]}"
          signed_length="${BASH_REMATCH[2]}"
          length="$(/usr/bin/stat -f '%z' "$pkg")"
          [[ "$length" =~ ^[0-9]+$ ]]
          test "$length" -gt 0
          test "$signed_length" = "$length"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$pkg")"
          SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            bash Packaging/Scripts/render-appcast.sh \
              "$EMKE_VERSION" "$EMKE_BUILD_NUMBER" "$url" \
              "$signature" "$length" "$runner_temp/appcast.xml"
          /usr/bin/xmllint --noout "$runner_temp/appcast.xml"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pkg=".build/distribution/EMKE-Translation-${EMKE_VERSION}-internal.pkg"
          test -s "$pkg"
          asset_name="$(basename "$pkg")"
          local_size="$(/usr/bin/stat -f '%z' "$pkg")"
          [[ "$local_size" =~ ^[0-9]+$ ]]
          test "$local_size" -gt 0
          local_sha="$(
            /usr/bin/shasum -a 256 "$pkg" | /usr/bin/awk '{print $1}'
          )"
          [[ "$local_sha" =~ ^[0-9a-f]{64}$ ]]
          local_digest="sha256:${local_sha}"
          if gh release view "$GITHUB_REF_NAME" \
            --json id --jq '.id' >/dev/null 2>&1; then
            echo "GitHub Release already exists; verifying its PKG asset."
          else
            if ! gh release create "$GITHUB_REF_NAME" \
              --title "EMKE Translation ${EMKE_VERSION}" \
              --generate-notes \
              --verify-tag; then
              echo "Release creation failed; checking for a concurrent or partial creation." >&2
              gh release view "$GITHUB_REF_NAME" \
                --json id --jq '.id' >/dev/null
            fi
          fi
          fetch_asset_rows() {
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
              --jq '.assets[] | [.name, (.size | tostring), (.digest // "")] | @tsv'
          }
          inspect_expected_asset() {
            local rows="$1"
            local inspection
            inspection="$(
              /usr/bin/awk -F '	' -v expected="$asset_name" '
                $1 == expected {
                  matches += 1
                  size = $2
                  digest = $3
                }
                END {
                  printf "%d|%s|%s\n", matches, size, digest
                }
              ' <<< "$rows"
            )"
            IFS='|' read -r asset_count remote_size remote_digest \
              <<< "$inspection"
            [[ "$asset_count" =~ ^[0-9]+$ ]]
          }
          asset_rows="$(fetch_asset_rows)"
          inspect_expected_asset "$asset_rows"
          case "$asset_count" in
            0)
              gh release upload "$GITHUB_REF_NAME" "$pkg"
              ;;
            1)
              if [[ ! "$remote_size" =~ ^[0-9]+$ ]] || \
                [[ ! "$remote_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || \
                test "$remote_size" != "$local_size" || \
                test "$remote_digest" != "$local_digest"; then
                echo "existing GitHub Release asset cannot be proven identical" >&2
                exit 1
              fi
              echo "GitHub Release asset is already identical; reusing it."
              ;;
            *)
              echo "duplicate GitHub Release assets match the expected name" >&2
              exit 1
              ;;
          esac
          asset_rows="$(fetch_asset_rows)"
          inspect_expected_asset "$asset_rows"
          test "$asset_count" = 1
          [[ "$remote_size" =~ ^[0-9]+$ ]]
          [[ "$remote_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$remote_size" = "$local_size"
          test "$remote_digest" = "$local_digest"
          echo "Verified immutable GitHub Release asset: ${asset_name} (${remote_size} bytes)."

      - name: Publish Appcast to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runner_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          test "$runner_temp" != /
          test -s "$runner_temp/appcast.xml"
          publish="$runner_temp/emke-appcast-branch"
          case "$publish" in
            "$runner_temp"/*) ;;
            *) echo "unsafe Appcast checkout path" >&2; exit 1 ;;
          esac
          askpass="$runner_temp/emke-git-askpass.sh"
          /usr/bin/printf '%s\n' \
            '#!/bin/bash' \
            'case "$1" in' \
            '  *Username*) /usr/bin/printf "%s\n" "x-access-token" ;;' \
            '  *Password*) /usr/bin/printf "%s\n" "$GITHUB_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$askpass"
          /bin/chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git clone --no-checkout \
              "https://github.com/${GITHUB_REPOSITORY}.git" "$publish"
          if git -C "$publish" show-ref --verify --quiet \
            refs/remotes/origin/gh-pages; then
            git -C "$publish" checkout -B gh-pages origin/gh-pages
          else
            git -C "$publish" checkout --orphan gh-pages
            git -C "$publish" rm -rf . >/dev/null 2>&1 || true
          fi
          existing_appcast="$publish/appcast.xml"
          if test -L "$existing_appcast"; then
            echo "refusing symlinked existing Appcast" >&2
            exit 1
          fi
          if test -e "$existing_appcast"; then
            test -f "$existing_appcast"
            /usr/bin/xmllint --noout "$existing_appcast"
            enclosure_count="$(
              /usr/bin/xmllint --xpath \
                'count(/*[local-name()="rss"]/*[local-name()="channel"]/*[local-name()="item"]/*[local-name()="enclosure"])' \
                "$existing_appcast"
            )"
            test "$enclosure_count" = 1
            enclosure_xpath='/*[local-name()="rss"]/*[local-name()="channel"]/*[local-name()="item"]/*[local-name()="enclosure"]'
            existing_build="$(
              /usr/bin/xmllint --xpath \
                "string($enclosure_xpath/@*[local-name()=\"version\"])" \
                "$existing_appcast"
            )"
            existing_version="$(
              /usr/bin/xmllint --xpath \
                "string($enclosure_xpath/@*[local-name()=\"shortVersionString\"])" \
                "$existing_appcast"
            )"
            existing_url="$(
              /usr/bin/xmllint --xpath \
                "string($enclosure_xpath/@url)" "$existing_appcast"
            )"
            existing_signature="$(
              /usr/bin/xmllint --xpath \
                "string($enclosure_xpath/@*[local-name()=\"edSignature\"])" \
                "$existing_appcast"
            )"
            existing_length="$(
              /usr/bin/xmllint --xpath \
                "string($enclosure_xpath/@length)" "$existing_appcast"
            )"
            [[ "$existing_build" =~ ^[0-9]+$ ]]
            test "${#existing_build}" -le 20
            [[ "$existing_version" =~ ^[0-9]+(\.[0-9]+)*$ ]]
            test "${#existing_version}" -le 64
            [[ "$existing_url" =~ ^https://[^[:space:]]+$ ]]
            [[ "$existing_signature" =~ ^[A-Za-z0-9+/]{86}==$ ]]
            [[ "$existing_length" =~ ^[0-9]+$ ]]
            test "${#existing_length}" -le 20
            normalized_existing="$(
              /usr/bin/printf '%s\n' "$existing_build" | \
                /usr/bin/sed 's/^0*//'
            )"
            normalized_candidate="$(
              /usr/bin/printf '%s\n' "$EMKE_BUILD_NUMBER" | \
                /usr/bin/sed 's/^0*//'
            )"
            normalized_length="$(
              /usr/bin/printf '%s\n' "$existing_length" | \
                /usr/bin/sed 's/^0*//'
            )"
            test -n "$normalized_existing" || normalized_existing=0
            test -n "$normalized_candidate" || normalized_candidate=0
            test -n "$normalized_length" || normalized_length=0
            test "$normalized_length" != 0
            same_width_higher=0
            if test "${#normalized_existing}" -eq \
              "${#normalized_candidate}" && \
              LC_ALL=C /usr/bin/awk \
                -v left="$normalized_existing" \
                -v right="$normalized_candidate" \
                'BEGIN { exit !(("x" left) > ("x" right)) }'; then
              same_width_higher=1
            fi
            if test "${#normalized_existing}" -gt \
              "${#normalized_candidate}" || test "$same_width_higher" = 1; then
              echo "refusing Appcast rollback to build $EMKE_BUILD_NUMBER" >&2
              exit 1
            fi
            if test "$normalized_existing" = "$normalized_candidate"; then
              if /usr/bin/cmp "$runner_temp/appcast.xml" "$existing_appcast"; then
                echo "Appcast is unchanged; gh-pages already matches this release."
                exit 0
              fi
              echo "Appcast metadata mismatch for existing build $EMKE_BUILD_NUMBER" >&2
              exit 1
            fi
          fi
          /bin/cp "$runner_temp/appcast.xml" "$publish/appcast.xml"
          git -C "$publish" add appcast.xml
          git -C "$publish" \
            -c user.name=github-actions \
            -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "release: publish ${EMKE_VERSION} appcast"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git -C "$publish" push origin gh-pages
